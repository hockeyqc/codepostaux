function normalizePostalCode(input) {
  return input.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
}

function isJSHFemaleAssociation(assoc) {
  if (!assoc) return false;
  const nom = (assoc.nom || '').toUpperCase();
  const url = (assoc.url || '').toLowerCase();
  return url.includes('jsh.qc.ca') ||
         nom.includes('JEUNES SPORTIFS HOCHELAGA') ||
         /JSH/.test(nom);
}

function addJSHFemaleOnce(list) {
  // Standardise aussi toute ancienne variante de nom déjà présente.
  const existing = list.find(isJSHFemaleAssociation);
  if (existing) {
    existing.nom = jshFemaleAssociation.nom;
    existing.url = jshFemaleAssociation.url;
    return;
  }
  list.push({ ...jshFemaleAssociation });
}

function removeJSHFemale(list) {
  return list.filter(assoc => !isJSHFemaleAssociation(assoc));
}

function refineJSHFemaleResult(rawInput, baseResult) {
  const cleaned = normalizePostalCode(rawInput);
  const prefixe = cleaned.slice(0, 3);
  const codeComplet = cleaned.slice(0, 6);

  const resultat = {
    ahf: [...(baseResult?.ahf || [])].map(assoc => ({ ...assoc }))
  };

  // Les 19 préfixes marqués « complet » appartiennent entièrement à JSH.
  if (jshPostalRules.fullPrefixes.has(prefixe)) {
    resultat.ahf = [{ ...jshFemaleAssociation }];
    return resultat;
  }

  // H2V, H3J, H3Y et H3Z sont partagés.
  // À 3 caractères : on garde toutes les organisations du préfixe et on ajoute JSH.
  // À 6 caractères : si le code fait partie de la liste JSH, JSH devient le seul résultat.
  // Sinon, on garde les organisations normales du préfixe et on retire JSH.
  const prefixesPartiels = new Set(['H2V', 'H3J', 'H3Y', 'H3Z']);
  if (prefixesPartiels.has(prefixe)) {
    if (cleaned.length < 6) {
      addJSHFemaleOnce(resultat.ahf);
    } else if (jshPostalRules.specificCodes.has(codeComplet)) {
      resultat.ahf = [{ ...jshFemaleAssociation }];
      return resultat;
    } else {
      resultat.ahf = removeJSHFemale(resultat.ahf);
    }
  }

  // Pour les autres secteurs, on conserve les données existantes,
  // mais on uniformise le nom de JSH s'il est déjà présent.
  const hadJSH = resultat.ahf.some(isJSHFemaleAssociation);
  if (hadJSH) {
    resultat.ahf = removeJSHFemale(resultat.ahf);
    addJSHFemaleOnce(resultat.ahf);
  }

  return resultat;
}

document.getElementById("postal-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const raw = document.getElementById("postal-code").value;
  const cleaned = normalizePostalCode(raw);
  const prefixe = cleaned.slice(0, 3);
  const container = document.getElementById("results");
  container.innerHTML = "";

  if (prefixe.length < 3) {
    container.textContent = "Veuillez entrer les 3 premiers caractères de votre code postal (ex. : H3T).";
    return;
  }

  const baseResult = data[prefixe] || { ahf: [] };
  const resultat = refineJSHFemaleResult(raw, baseResult);

  if (!resultat.ahf || resultat.ahf.length === 0) {
    container.textContent = "Aucune association de hockey féminin trouvée pour ce code postal.";
    return;
  }

  const ahfHeader = document.createElement("h3");
  ahfHeader.textContent = "Hockey féminin";
  container.appendChild(ahfHeader);

  resultat.ahf.forEach(assoc => {
    const link = document.createElement("a");
    link.href = assoc.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = assoc.nom;
    link.className = "result-link";
    container.appendChild(link);
  });

  const contacts = resultat.ahf
    .map(assoc => ({ association: assoc.nom, contact: femaleHockeyContacts[assoc.nom] }))
    .filter(item => item.contact);

  if (contacts.length > 0) {
    const section = document.createElement("div");
    section.className = "contact-section";

    const intro = document.createElement("p");
    intro.textContent = contacts.length === 1
      ? "Des questions sur le hockey féminin? Vous pouvez communiquer avec la personne responsable de cette association :"
      : "Des questions sur le hockey féminin? Vous pouvez communiquer avec les personnes responsables de ces associations :";
    section.appendChild(intro);

    contacts.forEach(({ association, contact }) => {
      const ligne = document.createElement("p");
      ligne.className = "contact-item";
      const associationNom = document.createElement("strong");
      associationNom.textContent = association + " : ";
      ligne.appendChild(associationNom);
      ligne.appendChild(document.createTextNode(contact.nom + " — "));

      const courriel = document.createElement("a");
      courriel.href = "mailto:" + contact.courriel;
      courriel.textContent = contact.courriel;
      ligne.appendChild(courriel);
      section.appendChild(ligne);
    });

    container.appendChild(section);
  }
});
